[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "tests*"]

[project]
name = "nexora-mythos-fix"
version = "1.0.0"
description = "Governed Autonomous Vulnerability Remediation & Threat Immunity Control Plane"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Rohit Barui", email = "dev@nexora.io"}
]
keywords = [
    "vulnerability-remediation",
    "security-control-plane",
    "opa-policy",
    "rego",
    "temporal-workflows",
    "autonomous-security",
    "patch-management",
    "threat-immunity",
    "devsecops",
    "container-security",
    "cloud-security",
    "risk-engine",
    "hitl-approvals",
    "grpc-mtls"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "paramiko>=3.4.0",
    "pywinrm>=0.4.3",
    "boto3>=1.34.0",
    "kubernetes>=29.0.0",
    "temporalio>=1.5.0",
    "opa-python-client>=1.1.0",
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "prometheus-client>=0.20.0"
]

[project.urls]
Homepage = "https://github.com/rohit-barui/Nexora"
Repository = "https://github.com/rohit-barui/Nexora"
Documentation = "https://github.com/rohit-barui/Nexora#readme"
Changelog = "https://github.com/rohit-barui/Nexora/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/rohit-barui/Nexora/issues"
"PyPI Release" = "https://pypi.org/project/nexora-mythos-fix/"

[project.scripts]
nexora = "services.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.7.0",
    "aiosqlite>=0.20.0",
    "httpx2>=2.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
