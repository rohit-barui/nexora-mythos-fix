name: CI - Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check formatting (black)
        run: python -m black --check services tests

      - name: Check import sorting (isort)
        run: python -m isort --check services tests

      - name: Lint (flake8)
        run: python -m flake8 services tests

      - name: Run tests with coverage (pytest)
        run: python -m pytest tests/ --cov=services --cov-report=term-missing --cov-fail-under=50

      - name: Verify app imports cleanly
        run: python -c "from services.control_plane.main import app; assert len(app.routes) > 0"
